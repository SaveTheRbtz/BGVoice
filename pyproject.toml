[project]
name = "bgvoice"
version = "0.1.0"
description = "AI-generated voice-over tooling for Baldur's Gate EET dialogue."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "connectrpc==0.11.1",
    "fastapi>=0.135.1",
    "googleapis-common-protos>=1.75.2",
    "httpx>=0.28.1",
    "lancedb>=0.37.1",
    "openai>=3.5.0",
    "pillow>=12.1.1",
    "protobuf>=7.36,<8",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "soundfile>=0.14.0",
    "uvicorn>=0.41.0",
]

[project.scripts]
bgvoice = "bgvoice.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--cov=bgvoice",
    "--cov-report=term-missing:skip-covered",
    "--import-mode=importlib",
]
filterwarnings = ["error"]
markers = ["integration: exercises multiple application boundaries"]
strict = true
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
omit = ["src/bgvoice/v1/*"]

[tool.coverage.report]
fail_under = 95

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/bgvoice/v1"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PYI",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/bgvoice/v1"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
